name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aidtrace
          POSTGRES_PASSWORD: aidtrace
          POSTGRES_DB: aidtrace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aidtrace -d aidtrace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://aidtrace:aidtrace@127.0.0.1:5432/aidtrace_runtime
      TEST_DATABASE_URL: postgresql://aidtrace:aidtrace@localhost:5432/aidtrace_test
      TEST_DATABASE_URL_UNPOOLED: postgresql://aidtrace:aidtrace@localhost:5432/aidtrace_test
      TEST_DATABASE_BRANCH: test
      PRODUCTION_DATABASE_HOST: production.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
