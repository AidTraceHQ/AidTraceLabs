name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aidtrace_migration
          POSTGRES_PASSWORD: aidtrace_migration
          POSTGRES_DB: aidtrace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aidtrace_migration -d aidtrace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://aidtrace_runtime:aidtrace_runtime@127.0.0.1:5432/aidtrace_test
      DATABASE_URL_UNPOOLED: postgresql://aidtrace_migration:aidtrace_migration@localhost:5432/aidtrace_test
      TEST_DATABASE_URL: postgresql://aidtrace_runtime:aidtrace_runtime@localhost:5432/aidtrace_test
      TEST_DATABASE_URL_UNPOOLED: postgresql://aidtrace_migration:aidtrace_migration@localhost:5432/aidtrace_test
      TEST_DATABASE_BRANCH: test
      PRODUCTION_DATABASE_HOST: production.invalid
      SESSION_SECRET: aidtrace-ci-session-secret-placeholder-with-32-bytes
      PSEUDONYM_SECRET: aidtrace-ci-pseudonym-secret-placeholder-with-32-bytes
      PUBLIC_APP_ORIGIN: http://localhost:5173
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      DEFAULT_STELLAR_NETWORK: testnet
      HORIZON_TESTNET_URL: https://horizon-testnet.stellar.org
      HORIZON_MAINNET_URL: https://horizon.stellar.org
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Configure restricted runtime database role
        run: |
          PGPASSWORD=aidtrace_migration psql -h localhost -U aidtrace_migration -d aidtrace_test -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE aidtrace_runtime LOGIN PASSWORD 'aidtrace_runtime'" \
            -c "GRANT CONNECT ON DATABASE aidtrace_test TO aidtrace_runtime" \
            -c "GRANT USAGE ON SCHEMA public TO aidtrace_runtime" \
            -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON TABLES TO aidtrace_runtime"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm test
      - run: npm run smoke
        env:
          DATABASE_URL: postgresql://aidtrace:aidtrace@localhost:5432/aidtrace_test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Production dependencies only. Dev-tool advisories are reviewed through Dependabot and tracked separately.
      - run: npm audit --omit=dev --audit-level=high
