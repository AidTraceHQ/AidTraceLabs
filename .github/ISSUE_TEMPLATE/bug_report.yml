name: Bug report
description: Report a reproducible problem in AidTrace.
title: 'bug: '
labels: ['type: bug']
body:
  - type: markdown
    attributes:
      value: Do not include secrets, private keys, real beneficiary data, or production connection details.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the expected and observed behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: 1. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Node.js version, and selected Stellar network.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant safe logs
      description: Redact addresses and identifiers if they relate to real people.
