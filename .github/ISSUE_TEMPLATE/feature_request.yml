name: Feature request
description: Propose a focused improvement to AidTrace.
title: 'feat: '
labels: ['type: enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: Who encounters this and what is currently difficult?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request does not assume a Soroban contract or claim that on-chain payment proves real-world impact.
          required: true
